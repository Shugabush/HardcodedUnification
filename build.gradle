buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id "idea"
    id "eclipse"
    id "maven-publish"
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
    id 'com.diffplug.spotless' version '7.0.2'
}

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
    }
}

repositories {
    mavenLocal()
    mavenCentral()

    flatDir {
        dir 'libs'
    }

    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        name 'FirstDarkDev'
        url "https://maven.firstdark.dev/snapshots/"
    }
    maven { // Registrate
        url = "https://maven.tterrag.com/"
        content {
            // need to be specific here due to version overlaps
            includeGroup("com.tterrag.registrate")
        }
    }
    maven {
        // Patchouli, JEI
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        // Curse Forge File
        url "https://cursemaven.com/"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = "https://thedarkcolour.github.io/KotlinForForge/"
    }

}

version = mod_version
group = maven_group
base { archivesName = archives_base_name }
java { sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17 }

legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    runs {
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
            sourceSet = sourceSets.main
            programArguments.addAll('--refresh-dependencies')
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
        }
        server {
            server()
            sourceSet = sourceSets.main
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
            programArguments.addAll('--nogui', '--world', 'world-extra')
        }
        data {
            data()
            sourceSet = sourceSets.main
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll('--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath())
            programArguments.addAll('--existing-mod', 'gtceu')
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}
jar {
    manifest.attributes([
            "MixinConfigs": "hardcodedunification.mixins.json"
    ])
}

apply from: "$rootDir/gradle/scripts/spotless.gradle"

dependencies {
    compileOnly("org.jetbrains:annotations:26.0.1")

    // Mixin
    annotationProcessor('org.spongepowered:mixin:0.8.5:processor')

    // JEI, Jade
    modCompileOnly("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    modRuntimeOnly("curse.maven:jade-324717:5390389")

    // Almost Unified
    modImplementation("com.almostreliable.unified:almostunified-forge-${minecraft_version}-${almost_unified_version}")

    // Almost Fluidified
    modImplementation("com.shugabrush.almostfluidified:almostfluidified-${almost_fluidified_version}")

    // Kotlin for Forge
    modImplementation("thedarkcolour.kotlinforforge.forge:kotlinforforge-${kotlin_version}-all")

    // GregTech and dependencies
    modImplementation("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim") { transitive = false }
    modImplementation("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false }
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
    modImplementation("dev.toma.configuration:configuration-forge-${minecraft_version}:${configuration_version}")

    // lombok
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'

    // Powah and dependencies
    modImplementation("me.shedaniel:cloth-config-${cloth_version}-forge")
    modImplementation("me.shedaniel:architectury-${architectury_version}-forge")
    modImplementation("owmii.powah:Powah-${powah_version}")

    // Mekanism
    modImplementation("mekanism.common:Mekanism-${minecraft_version}-${mekanism_version}")

    // Sophisticated Mods
    modImplementation("net.p3pp3rf1y.sophisticatedcore:sophisticatedcore-${minecraft_version}-${sophisticated_core_version}")
    modImplementation("net.p3pp3rf1y.sophisticatedstorage:sophisticatedstorage-${minecraft_version}-${sophisticated_storage_version}")
    modImplementation("net.p3pp3rf1y.sophisticatedbackpacks:sophisticatedbackpacks-${minecraft_version}-${sophisticated_backpacks_version}")

    // Industrial Foregoing and dependencies
    modImplementation("com.hrznstudio.titanium:titanium-${minecraft_version}-${titanium_version}")
    modImplementation("com.buuz135.industrial:industrial-foregoing-${minecraft_version}-${industrial_foregoing_version}")

    // Stargate Journey
    modImplementation("net.povstalec.sgjourney:Stargate Journey-${minecraft_version}-${stargate_journey_version}")

    // Avaritia
    modImplementation("committee.nova.mods.avaritia:Re-Avaritia-forge-${minecraft_version}-${avaritia_version}-release")

    // Mob Grinding Utils
    modImplementation("mob_grinding_utils:mob_grinding_utils-${minecraft_version}-${mob_grinding_utils_version}")

    // UtilitiX and dependencies
    modImplementation("de.melanx.utilitix:UtilitiX-${minecraft_version}-${utilitix_version}")
    modImplementation("org.moddingx.libx:LibX-${minecraft_version}-${libx_version}")

    // Ad Astra and dependencies
    modImplementation("earth.terrarium.common_storage_lib:botarium-forge-${minecraft_version}-${botarium_version}")
    modImplementation("com.teamresourceful.resourcefulconfig:resourcefulconfig-forge-${minecraft_version}-${resourceful_config_version}")
    modImplementation("com.teamresourceful.resourcefullib:resourcefullib-forge-${minecraft_version}-${resourceful_lib_version}")
    modImplementation("earth.terrarium.adastra:ad_astra-forge-${minecraft_version}-${ad_astra_version}")

    // Curios
    modImplementation("top.theillusivec4.curios:curios-forge-${curios_version}+${minecraft_version}")

    // Applied Energistics 2 and dependencies/dependents
    modImplementation("appeng.core:appliedenergistics2-forge-${ae2_version}")
    modImplementation("guideme:guideme-${guideme_version}");
    modImplementation("net.pedroksl.ae2addonlib:AE2AddonLib-${ae2_addon_lib_version}-${minecraft_version}")
    modImplementation("net.pedroksl.advanced_ae:AdvancedAE-${advanced_ae_version}-${minecraft_version}")
    modImplementation("software.bernie.geckolib.core:geckolib-forge-${minecraft_version}-${geckolib_version}")
    modImplementation("com.glodblock.github.glodium:Glodium-1.20-${glodium_version}-forge")
    modImplementation("com.glodblock.github.ae2netanalyser:AppliedFlux-1.20-${applied_flux_version}-forge")
    modImplementation("me.ramidzkh.mekae2:Applied-Mekanistics-${applied_mekanistics_version}")
    modImplementation("curse.maven:mega-cells-622112:6175008")

    // I couldn't find the source code for Mekanism Tools and Mekanism Generators, so I'm using their maven repositories instead
    modImplementation("curse.maven:mekanism-tools-268567:6552915")
    modImplementation("curse.maven:mekanism-generators-268566:6552914")
    modImplementation("net.darkhax.bookshelf:Bookshelf-Forge-${minecraft_version}-${bookshelf_version}")

//    // Evolved mekanism and dependencies/dependents
//    modImplementation("fr.iglee42.evolvedmekanism:IgleesLibrary-${minecraft_version}-${iglees_library_version}")
//    modImplementation("fr.iglee42.igleelib:EvolvedMekanism-${minecraft_version}-${evolved_mekanism_version}")
//    modImplementation("com.jerry.mekanism_extras:mekanism_extras-${minecraft_version}-${mekanism_extras_version}")
//    modImplementation("io.github.masyumero.emextras:EvolvedMekanismExtras-${minecraft_version}-${evolved_mekanism_extras_version}")
//    modImplementation("com.CompactMekanismMachines.common:compactmekanismmachines-${compact_mekanism_machines_version}")

//    modImplementation("curse.maven:mekanism-elements-1103224:6537553")
//    modImplementation("curse.maven:mekanism-more-machine-1275257:7485850")
//    modImplementation("curse.maven:botany-pots-353928:7612402")
//    modImplementation("curse.maven:stack-upgrade-integration-1510741:7915901")

    // Astral Mekanism
    //modImplementation("astral_mekanism:astral_mekanism-${astral_mekanism_version}")

    // Draconic Evolution and dependencies
    modImplementation("codechicken.lib:CodeChickenLib-${minecraft_version}-${code_chicken_lib_version}")
    modImplementation("com.brandon3055.brandonscore:BrandonsCore-${minecraft_version}-${brandons_core_version}")
    modImplementation("com.brandon3055.draconicevolution:Draconic-Evolution-${minecraft_version}-${draconic_evolution_version}")

    // Botania and depencencies
    modImplementation("vazkii.patchouli.forge:Patchouli-${minecraft_version}-${patchouli_version}-FORGE")
    modImplementation("vazkii.botania.forge:Botania-${minecraft_version}-${botania_version}-FORGE")

    // Nova Mekanism
    modImplementation("com.falcon2235.moremultiblock:Nova-Mekanism-${minecraft_version}-${nova_mekanism_version}")
}

mixin {
    add sourceSets.main, "mixins.${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

tasks.named('processResources', ProcessResources).configure {
    var properties = [
            "mod_license": mod_license,
            "mod_id": mod_id,
            "version": version,
            "mod_name": mod_name,
            "mod_url": mod_url,
            "mod_author": mod_author,
            "forge_version": forge_version.split("\\.")[0], // only specify major version of forge
            "minecraft_version": minecraft_version,
            "gtceu_version": gtceu_version,
            "kotlin_version": kotlin_version,
            "configuration_version": configuration_version,
            "almost_unified_version": almost_unified_version,
            "almost_fluidified_version": almost_fluidified_version
    ]
    inputs.properties(properties)

    filesMatching("META-INF/mods.toml") {
        expand properties + [project: project]
    }
}

tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    options.encoding = "UTF-8"
    options.release.set(17)
    options.compilerArgs << "-Aquiet=true" // Suppress mixin notes
}
